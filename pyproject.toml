[project]
name = "donnstagsnachrichten"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "regex>=2026.9.29",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.161.0",
    "pre-commit>=4.6.1",
    "pytest>=9.0.3",
    "ruff>=0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
python_files = ["test_*.py", "testcases.py"]

[tool.ruff]
respect-gitignore = true
exclude = [
    ".venv", "venv", ".env",
    "build", "dist",
    ".mypy_cache", ".pytest_cache", ".ruff_cache",
    "__pycache__",
    "node_modules",
    "docs/_build",
    "src/data"
]

[tool.ruff.lint]
select = [
    "F",                      # pyflakes (unused vars, imports, …)
    "E", "W",   # pycodestyle (style basics)
    "I",                         # isort (import ordering)
    "UP",                   # pyupgrade (modern syntax → walrus, f-strings, …)
    "B",                # bugbear (common bugs)
    "C4",                     # comprehensions improvements
    "RUF",            # ruff's own good ideas
    "PD",                  # pandas-vet (if heavy pandas)
    "NPY",          # numpy specific (if numpy-heavy)
    "RET",                # consistent return (helps readability)
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "ANN",    # type annotation pedantry
    "D",      # pydocstyle / docstrings
    "S",      # bandit security (very noisy on pipelines)
    "TRY",    # tryceratops
    "SLF",    # private member access
    "ERA",    # commented-out code
    "DTZ",    # timezone naive
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D"]               # asserts ok, no docstrings
"notebooks/**" = ["D", "ANN", "E501"]           # very common relaxation
"**/migrations/*.py" = ["ALL"]                  # generated
"**/airflow_dags/**" = ["D", "ANN", "S"]        # if you have Airflow-style dags

[tool.ruff.format]
line-ending = "lf"
